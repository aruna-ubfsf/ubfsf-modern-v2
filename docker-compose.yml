# docker-compose.yml — local dev parity: Next.js app + WordPress + MySQL
services:
  # Next.js App
  app:
    build:
      context: .
      args:
        WORDPRESS_URL: http://wordpress:80
    ports:
      - "3000:3000"
    environment:
      - WORDPRESS_URL=http://wordpress:80
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-ubfsf_secret_2026_xyz}
    depends_on:
      - wordpress

  # WordPress CMS
  wordpress:
    image: wordpress:latest
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

  # MySQL
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_data:
  db_data:
